# Supabase local config. Link to remote via: npx supabase link --project-ref <ref>
# Docs: https://supabase.com/docs/reference/cli/config

project_id = "vidyapath"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
# Demo credentials and school records must be loaded deliberately. Keeping the
# destructive demo seed out of automatic resets also makes migration-only CI
# validation deterministic against a fresh database.
enabled = false
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions]

[analytics]
enabled = false
