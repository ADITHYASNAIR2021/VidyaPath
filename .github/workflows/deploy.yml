name: Release Readiness

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      SESSION_SIGNING_SECRET: ci-deploy-secret-32chars-minimum-required-001
      ADMIN_PORTAL_KEY: ci-admin-key
      TEACHER_PORTAL_KEY: ci-teacher-key
      DEVELOPER_USERNAME: ci-dev
      DEVELOPER_PASSWORD: ci-dev-pw
      NEXT_PUBLIC_SUPABASE_URL: https://ci-example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-key
      NEXT_PUBLIC_APP_URL: https://ci-example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm run lint:strict
      - run: npm run test
      - run: npm run test:security-guards

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      SESSION_SIGNING_SECRET: ci-build-secret-32chars-minimum-required-001
      TEACHER_PORTAL_KEY: ci-teacher-key
      DEVELOPER_USERNAME: ci-dev
      DEVELOPER_PASSWORD: ci-dev-pw
      NEXT_PUBLIC_SUPABASE_URL: https://ci-example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-service-key
      NEXT_PUBLIC_APP_URL: https://ci-example.com
      STRICT_ENV_VALIDATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build
      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: .next
          key: build-${{ github.sha }}

  docker:
    name: Docker Build & Health Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .next
          key: build-${{ github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: vidyapath:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify health check
        run: |
          set -euo pipefail
          docker run -d --name vp-health-check \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e SESSION_SIGNING_SECRET=ci-docker-session-secret-32chars-minimum-001 \
            -e TEACHER_PORTAL_KEY=test-key \
            -e DEVELOPER_USERNAME=test \
            -e DEVELOPER_PASSWORD=test \
            -e NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            -e NEXT_PUBLIC_SUPABASE_ANON_KEY=test \
            -e NEXT_PUBLIC_APP_URL=https://example.com \
            vidyapath:latest
          trap 'docker inspect --format="{{json .State.Health}}" vp-health-check || true; docker logs vp-health-check || true; docker rm -f vp-health-check || true' EXIT
          for attempt in $(seq 1 18); do
            status="$(docker inspect --format='{{.State.Health.Status}}' vp-health-check)"
            echo "health attempt ${attempt}: ${status}"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              exit 1
            fi
            sleep 5
          done
          echo "Container did not become healthy within 90 seconds."
          exit 1
