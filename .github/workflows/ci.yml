name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Typecheck, Lint, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:strict

      - name: Unit tests
        run: npm run test

      - name: Route and URL integrity
        run: npm run check:route-links

  audit:
    name: Dependency Audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (json)
        # npm audit exits non-zero when it finds any advisory. The policy step
        # below decides which severities/accepted risks fail CI, so preserve
        # the report and let that step make the decision.
        run: npm audit --omit=dev --json > .audit-report.json || true

      - name: Enforce audit policy
        run: npm run audit:policy

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build

      - name: Check serverless function sizes
        run: npm run check:function-sizes
